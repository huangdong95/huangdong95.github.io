<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  {% seo title=false %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">
      <img class="site-logo" src="{{ '/assets/img/yale-som-shield.svg' | relative_url }}" alt="">
      {{ site.author.name }} @ Yale SOM
    </a>
    <nav class="site-nav">
      <!-- Add more pages here as the site grows, e.g.
      <a href="{{ '/teaching/' | relative_url }}">Teaching</a> -->
      <!-- CV link disabled until assets/cv.pdf is ready; uncomment to re-enable:
      <a href="{{ site.author.cv | relative_url }}">CV</a> -->
    </nav>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    &copy; {{ site.time | date: "%Y" }} {{ site.author.name }}
  </footer>
</body>
</html>
