- title: "Delegating Dirty Work: Blame Shifting and the Boundary of the Firm"
  status: Job Market Paper
  note: "(Draft coming soon)"
  abstract: >
    Why do firms outsource customer-facing activities to agents with weaker incentives
    to protect customer relationships? We show that delegation provides an offsetting
    benefit: blame shifting. We exploit a quasi-random setting at an online consumer
    lender that randomly assigns delinquent borrowers to in-house and third-party debt
    collectors, who differ systematically in collection harshness as measured by their
    propensity to call borrowers' social contacts. Social-contact calling raises
    short-run debt recovery in both sectors, but only in-house calling deters borrowers
    — particularly high-credit-quality borrowers — from returning to the lender after
    repaying. Outsourcing therefore preserves the benefit of aggressive conduct while
    insulating the firm from its relationship cost.

- title: "How Good is AI at Twisting Arms? Experiments in Debt Collection"
  coauthors:
    - name: James J. Choi
      url: https://faculty.som.yale.edu/jameschoi/
    - name: Zhishu Yang
    - name: Qi Zhang
  status: Publications and Working Papers
  year: 2025
  venue_status: Reject and Resubmit
  venue: Journal of Finance
  nber: 33669
  media:
    - label: Auto Finance News
      url: https://www.autofinancenews.net/allposts/technology/ai-debt-collectors-fare-worse-than-humans/
  abstract: >
    How good is AI at persuading humans to perform costly actions? We study calls made
    to get delinquent consumer borrowers to repay. Regression discontinuity and a
    randomized experiment reveal that AI is substantially less effective than human
    callers. Replacing AI with humans six days into delinquency closes much of the gap.
    But borrowers initially contacted by AI have repaid 1% less of the initial late
    payment one year later and are more likely to miss subsequent payments than
    borrowers who were always called by humans. AI's lesser ability to extract promises
    that feel binding may contribute to the performance gap.

- title: "Selection-Neglect in the NFT Bubble"
  coauthors:
    - name: William N. Goetzmann
      url: https://som.yale.edu/faculty-research/faculty-directory/william-n-goetzmann
  status: Publications and Working Papers
  year: 2023
  nber: 31498
  abstract: >
    Using transaction data from a large non-fungible token (NFT) trading platform, this
    paper examines how the behavioral bias of selection-neglect interacts with
    extrapolative beliefs, accelerating the boom and delaying the crash in the recent
    NFT bubble. We show that the price-volume relationship is consistent with
    extrapolative beliefs about increasing prices which were plausibly triggered by a
    macroeconomic shock. We test the hypothesis that agents prone to selection-neglect
    formed even more optimistic beliefs and traded more aggressively than their
    counterparts during the boom. When liquidity for NFTs declined, observed NFT prices
    were subject to severe selection bias due in part to seller loss aversion delaying
    the onset of the crash. Finally, we show that market participants with sophisticated
    bidding behavior were less subject to selection bias and performed better.

- title: "Heterogeneous Housing Markets: Selection Bias and Latent Sub-Markets in U.S. House Price Indexes"
  coauthors:
    - name: William N. Goetzmann
      url: https://som.yale.edu/faculty-research/faculty-directory/william-n-goetzmann
  status: Publications and Working Papers
  abstract: >
    The most widely used U.S. house price indexes estimate a single price path for each
    metropolitan area and assume that the homes that sell are representative of the
    wider housing stock. We develop a Bayesian repeat-sales model that relaxes both
    assumptions. It corrects a repeat-sales index for selection on the return since
    purchase using a nonparametric selection function and it assigns properties to
    latent sub-market, each with its own loading on a common factor, idiosyncratic
    drift, and selection function. Across the 20 Case-Shiller metros, uncorrected
    indexes overstate 1990–2020 appreciation in every metro, by 0.2 to 1.9 percentage
    points a year. For New Haven County, the model identifies three sub-markets that
    are geographically concentrated without using location data. Selection bias is
    concentrated in a small, high-volatility city segment. Membership in this segment
    changes at the city boundary in ways tract demographics do not explain.

- title: "Non-Fungible Tokens as Investment"
  coauthors:
    - name: William N. Goetzmann
      url: https://som.yale.edu/faculty-research/faculty-directory/william-n-goetzmann
    - name: Milad Nozari
  status: Publications and Working Papers
  venue: "International Journal of Arts Management"
  venue_details: "29(1), 2026, pp. 74–101"
  nber: 34837
  media:
    - label: VoxEU
      url: https://cepr.org/voxeu/columns/non-fungible-token-bubble-what-investors-actually-earned
  abstract: >
    NFTs provided a real-time laboratory for bubble economics: returns were
    exceptionally right-skewed, illiquidity pervaded even the most active platforms,
    and a handful of trades drove aggregate performance. Investors extrapolating from
    realized returns without recognizing selection bias and survivorship faced a
    substantial risk of disappointment. As our data and simulations confirm,
    successful NFT investing during the bubble required an almost perfect confluence
    of timing, liquidity, and luck.
